<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex006</title>
    <style>
        div#area {
            background-color: green;
            color: white;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!--onclick="clicou()" onmouseenter="entrar()" onmouseout="sair()-->
    <div id="area">Interaja</div>
    <script>
        var a = document.getElementById('area')
        a.addEventListener('click', clicou)
        a.addEventListener('mouseenter', entrar)
        a.addEventListener('mouseout', sair)
        function clicou(){
            a.innerText =  'clicou'
            a.style.backgroundColor = 'red'
        }
        function sair(){
            a.innerText = 'saiu'
            a.style.backgroundColor = 'green'
        }
        function entrar(){
            a.innerText = 'entrou'
            a.style.backgroundColor = 'green'
        }
    </script>
</body>
</html>
